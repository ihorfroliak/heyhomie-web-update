name: CI/CD Pipeline

on:
    push:
        branches:
            - master

jobs:
    lint:
        name: Lint & test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 12
                  cache: npm

            - name: Install dependencies
              run: npm install

            - name: Lint code
              run: npm run lint

            - name: Run tests
              run: npm run test:ci

    ci:
        name: Continuous Integration
        needs: lint
        runs-on: ubuntu-latest
        container:
            image: catthehacker/ubuntu:act-latest
        env:
            REGISTRY: gitea.stuzer.link
            OWNER: heyhomie
            REPOSITORY: heyhomie-client

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Set up build information
              run: |
                  echo APP_VERSION_TAG=$(git rev-parse --short HEAD) >> $GITHUB_ENV

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Gitea Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ vars.DOCKER_ACTIONS_BOT_USERNAME }}
                  password: ${{ secrets.DOCKER_ACTIONS_BOT_PASS }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}:latest
                      ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}:${{ env.APP_VERSION_TAG }}
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}:latest
                  cache-to: type=inline
